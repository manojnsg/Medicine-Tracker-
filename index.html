<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Medicine Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<header>
<h1>💊 Smart Medicine Tracker</h1>
</header>

<!-- 1 Home -->
<section id="home" class="page">
<h2>Welcome</h2>
<button onclick="goTo('login')">Login</button>
<button onclick="goTo('signup')">Signup</button>
</section>

<!-- 2 Login -->
<section id="login" class="page">
<h2>Login</h2>
<input id="loginUser" placeholder="Username">
<input id="loginPass" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button onclick="goTo('home')">Back</button>
</section>

<!-- 3 Signup -->
<section id="signup" class="page">
<h2>Signup</h2>
<input id="signupUser" placeholder="Username">
<input id="signupPass" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="goTo('home')">Back</button>
</section>

<!-- 4 Dashboard -->
<section id="dashboard" class="page">
<h2>Dashboard</h2>
<button onclick="goTo('add')">Add Medicine</button>
<button onclick="goTo('history')">History</button>
<button onclick="goTo('appointment')">Appointment</button>
<button onclick="goTo('profile')">Profile</button>
<button onclick="logout()">Logout</button>
<ul id="todayList"></ul>
</section>

<!-- 5 Add Medicine -->
<section id="add" class="page">
<h2>Add Medicine</h2>
<input id="medName" placeholder="Medicine Name">
<input id="medDose" type="number" placeholder="Dosage">
<input id="medTime" type="time">
<button onclick="addMedicine()">Save</button>
<button onclick="goTo('dashboard')">Back</button>
</section>

<!-- 6 History -->
<section id="history" class="page">
<h2>History</h2>
<ul id="historyList"></ul>
<button onclick="goTo('dashboard')">Back</button>
</section>

<!-- 7 Appointment -->
<section id="appointment" class="page">
<h2>Appointment</h2>
<input id="docName" placeholder="Doctor Name">
<input id="appDate" type="datetime-local">
<button onclick="addAppointment()">Save</button>
<ul id="appointmentList"></ul>
<button onclick="goTo('dashboard')">Back</button>
</section>

<!-- 8 Profile -->
<section id="profile" class="page">
<h2>Profile</h2>
<input id="profileName" placeholder="Your Name">
<button onclick="saveProfile()">Save</button>
<button onclick="goTo('dashboard')">Back</button>
</section>

<!-- 9 Overdose -->
<section id="overdose" class="page">
<h2>⚠ Overdose Warning</h2>
<p id="overdoseMsg"></p>
<button onclick="goTo('dashboard')">Back</button>
</section>

<script src="app.js"></script>
</body>
</html>
